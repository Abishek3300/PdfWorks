name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pinned action versions (Req 45.1). The build fails on any critical-severity
# dependency or image finding (Req 45.2, 45.3).
jobs:
  rust:
    name: Rust build & test (native + wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (native)
        run: cargo build --workspace

      - name: Build pdf-engine (wasm32-unknown-unknown)
        run: cargo build --target wasm32-unknown-unknown -p pdf-engine

      - name: Test
        run: cargo test --workspace

  web:
    name: Frontend install & check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.18.0
      - run: npm ci
      - run: npm run check
      - run: npm run build

  dependency-scan:
    name: Dependency_Scanner (crates + image)
    runs-on: ubuntu-24.04
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install Node (for npm audit)
        uses: actions/setup-node@v4
        with:
          node-version: 18.18.0
      - name: Install frontend deps (produces lockfile for audit)
        run: npm ci
        working-directory: apps/web

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.0

      - name: Build backend image (for scanning)
        run: docker build -f docker/backend.Dockerfile -t pdf-tools-suite/backend:0.1.0 .

      - name: Run Dependency_Scanner (fails on CRITICAL)
        run: bash scripts/dependency-scan.sh
        env:
          BACKEND_IMAGE: pdf-tools-suite/backend:0.1.0
