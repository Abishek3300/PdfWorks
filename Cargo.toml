[workspace]
resolver = "2"
members = [
    "crates/pdf-engine",
    "crates/backend",
]

# Shared dependency versions for the workspace. Every dependency is pinned to an
# exact version (leading `=`) so builds are reproducible and the Dependency_Scanner
# evaluates a known, fixed dependency set (Req 45.1).
[workspace.dependencies]
# Pure, I/O-free primitives used by the shared engine. These MUST stay
# WASM-compatible: no native-only / system-linking dependencies here.
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
thiserror = "=1.0.63"
# Pure-Rust PDF object model / parser / serializer. WASM-compatible: default
# features off so the native-only `rayon` thread pool and `chrono-clock`
# system-time backends are NOT pulled in; only the pure nom parser + core are
# used by the shared engine. The wasm32 target additionally enables the
# `wasm_js` feature so `getrandom` has a browser entropy source (see
# crates/pdf-engine/Cargo.toml target-specific dependency).
lopdf = { version = "=0.43.0", default-features = false }
# Pure-Rust JPEG decoder used only to read image dimensions/pixels for JPG->PDF
# (Task 3.3, Req 12.1). No native/system dependencies, so it stays
# WASM-compatible for the shared engine.
jpeg-decoder = { version = "=0.3.2", default-features = false }
# Pure-Rust CommonMark pull parser for Markdown->PDF rendering and the
# Markdown round-trip (Task 3.7, Req 17, 30.1). `default-features = false`
# drops the CLI-only `getopts` and HTML renderer, keeping only the pure event
# parser, which is WASM-compatible.
pulldown-cmark = { version = "=0.13.4", default-features = false }
# Pure-Rust JPEG encoder used by the in-engine PDF -> JPG raster path so one
# real JPG is produced per page (Task 3.3, Req 18.1, Property 9). WASM-compatible;
# full-fidelity pdfium rendering is deferred to the server plane (Task 19.3).
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std"] }
# Cryptographically secure entropy source for the Job_Token generator (Task 6.6,
# Req 43.1, 43.2). WASM-compatible: the backend is selected per target via
# `.cargo/config.toml` (`wasm_js` for wasm32, `rdrand` for windows-gnu), so no
# native-only RNG crate is pulled in. Pinned exact (Req 45.1) and matched to the
# version already present transitively via lopdf.
getrandom = "=0.4.3"

# --- WASM binding layer (Task 7.1, Req 37.5, 47.1) ---
# These crates are compiled ONLY for the wasm32 target (gated by
# `#[cfg(target_family = "wasm")]` in pdf-engine) so the native build and the
# native `cargo test -p pdf-engine` remain completely unaffected. All pinned
# exact (leading `=`) for reproducible builds (Req 45.1).
#
# `wasm-bindgen` generates the JS<->WASM glue for the JS-callable entry point.
# The tool id + options are passed as a JSON string (parsed with `serde_json`),
# and source/output bytes cross as `Uint8Array` via `js_sys`, so no additional
# serde bridge crate is needed.
wasm-bindgen = "=0.2.100"
# `js_sys` provides the `Uint8Array`/`Array`/`Object`/`Error` bindings the thin
# entry point uses to marshal bytes and results across the JS boundary. Its
# version tracks the pinned `wasm-bindgen` and satisfies the `^0.3.77` floor
# required transitively by `getrandom` on wasm32.
js-sys = "=0.3.77"

# Property-based testing (dev-only) for the shared engine (design Testing Strategy).
# `fork`/`timeout` are disabled so the dev build does not pull `tempfile` ->
# `windows-sys` (whose raw-dylib import libraries cannot be generated by the GNU
# toolchain's bundled dlltool in this environment). The engine's property tests
# are pure and deterministic, so process forking / per-case timeouts are not
# needed. `std` + `bit-set` retain the full generator/shrinking surface.
proptest = { version = "=1.5.0", default-features = false, features = ["std", "bit-set"] }

# Native-only backend dependencies (never referenced by pdf-engine).
tokio = { version = "=1.40.0", features = ["full"] }
# `multipart` enables the `axum::extract::Multipart` extractor used by the
# `POST /api/jobs` intake to receive `tool` + `options` + uploaded `files[]`
# (design §8 API intake). Pinned exact (Req 45.1).
axum = { version = "=0.7.5", features = ["multipart"] }
tower = "=0.5.1"
tower-http = { version = "=0.5.2", features = ["cors", "limit", "trace"] }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
redis = { version = "=0.27.2", features = ["tokio-comp"] }
# Authenticated encryption at rest for the File_Store (Task 16.1, Req 44.1).
# Pinned EXACT (Req 45.1) to the widely-audited RustCrypto AES-GCM. `aes` +
# `alloc` provide AES-256-GCM over `Vec<u8>`; no `getrandom`/`std` default
# features are pulled so the nonce source is supplied by the caller and the
# dependency surface stays minimal and reproducible.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
# Async trait objects for the File_Store abstraction (in-memory + S3 impls,
# Task 16.1). Pinned exact; already present transitively so no new lockfile
# churn beyond the pin.
async-trait = "=0.1.92"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
